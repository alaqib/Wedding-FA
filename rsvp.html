<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f3e9"><title>RSVP | Fazilla & Aqib</title><style>:root{--ivory:#f8f3e9;--paper:#fffdf8;--forest:#173c32;--gold:#b5904c;--line:#ded1bb;--muted:#766f64}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f3e9,#efe2ce);color:#24332d;font-family:Georgia,'Times New Roman',serif;min-height:100vh}.wrap{width:min(680px,calc(100% - 30px));margin:auto;padding:45px 0 80px}.card{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:30px 22px;box-shadow:0 20px 60px #4b38231a}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:center}.logo{display:block;width:min(220px,62vw);margin:0 auto 12px}.logo-wrap{text-align:center}.logo-wrap canvas{max-width:100%;height:auto}.title{text-align:center;font-size:42px;font-weight:400;margin:10px 0 8px}.sub{text-align:center;color:var(--muted);line-height:1.7;margin:0 auto 28px;max-width:500px}.field{margin:16px 0}.field label{display:block;font:700 11px Arial,sans-serif;letter-spacing:.08em;margin-bottom:8px;color:#365146}.field input,.field select,.field textarea{width:100%;border:1px solid #d8ccb8;background:#fff;padding:14px 15px;border-radius:14px;font:16px Arial,sans-serif;color:#24332d;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b5904c18}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;border:0;border-radius:999px;padding:15px 20px;background:var(--forest);color:white;font:700 13px Arial,sans-serif;letter-spacing:.04em;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.55;cursor:not-allowed}.status{display:none;margin-top:18px;padding:14px 16px;border-radius:14px;font:13px Arial,sans-serif;line-height:1.5}.status.show{display:block}.status.ok{background:#eaf4ef;color:#174b34}.status.err{background:#f9e8e6;color:#7d2f27}.back{display:block;text-align:center;margin-top:18px;color:var(--forest);text-decoration:none;font:13px Arial,sans-serif}@media(max-width:560px){.row{grid-template-columns:1fr}.title{font-size:36px}.card{padding:26px 17px}}</style></head><body><div class="wrap"><div class="card"><div class="logo-wrap"><img id="logo" src="assets/fa-logo.webp" alt="Fazilla & Aqib" class="logo"></div><div class="eyebrow">12 · 12 · 2026</div><h1 class="title">RSVP</h1><p class="sub">Sila sahkan kehadiran anda ke majlis Fazilla & Aqib di Dewan Kilimu, Ranau.</p><form id="rsvpForm"><div class="field"><label>NAMA TETAMU *</label><input name="name" autocomplete="name" required maxlength="120" placeholder="Contoh: Ahmad bin Ali"></div><div class="row"><div class="field"><label>KEHADIRAN *</label><select name="attendance" required><option value="">Pilih</option><option value="Hadir">Hadir</option><option value="Tidak Hadir">Tidak Hadir</option></select></div><div class="field"><label>BILANGAN PAX</label><input name="pax" type="number" min="0" max="20" value="1"></div></div><div class="field"><label>NO. TELEFON</label><input name="phone" inputmode="tel" maxlength="40" placeholder="01X-XXXXXXX"></div><div class="field"><label>UCAPAN</label><textarea name="message" maxlength="500" placeholder="Ucapan untuk Fazilla & Aqib"></textarea></div><input type="hidden" name="source" value="Wedding-FA GitHub Pages"><button id="submitBtn" class="btn" type="submit">Hantar RSVP</button><div id="status" class="status"></div></form><a class="back" href="./">← Kembali ke jemputan</a></div></div><script src="assets/rsvp-config.js"></script><script>(async()=>{try{const im=document.getElementById('logo');await im.decode();const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height);for(let i=0;i<d.data.length;i+=4){const r=d.data[i],g=d.data[i+1],b=d.data[i+2],m=(r+g+b)/3;if(r>242&&g>242&&b>242)d.data[i+3]=0;else if(r>220&&g>220&&b>220)d.data[i+3]=Math.max(0,Math.min(255,(242-m)/22*255));}x.putImageData(d,0,0);im.src=c.toDataURL('image/png')}catch(e){}})();const form=document.getElementById('rsvpForm'),btn=document.getElementById('submitBtn'),status=document.getElementById('status');function show(msg,type){status.textContent=msg;status.className='status show '+type}form.addEventListener('submit',async e=>{e.preventDefault();const endpoint=window.RSVP_ENDPOINT||'';if(!endpoint){show('RSVP sedang disambungkan. Cuba semula sebentar lagi.','err');return}btn.disabled=true;btn.textContent='Menghantar…';try{await fetch(endpoint,{method:'POST',mode:'no-cors',body:new FormData(form)});show('RSVP berjaya dihantar. Terima kasih!','ok');form.reset();form.elements.pax.value='1'}catch(err){show('Tidak dapat menghantar RSVP. Sila cuba lagi.','err')}finally{btn.disabled=false;btn.textContent='Hantar RSVP'}});</script></body></html>
