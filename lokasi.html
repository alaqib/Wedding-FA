<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3b0d16">
  <title>Lokasi Majlis | Fazilla & Aqib</title>
  <meta name="description" content="Pilih aplikasi navigasi ke Dewan Serbaguna Kampung Kilimu, Ranau, Sabah.">
  <style>
    :root{--bg:#3b0d16;--bg2:#741f33;--gold:#d9bd80;--gold2:#f2e3bd;--cream:#fff8ef;--muted:#e6d8cb}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 15%,#7b1d38 0,#4a0f1d 38%,#29070f 100%);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    .card{width:min(460px,100%);text-align:center;padding:36px 24px 30px;border:1px solid rgba(217,189,128,.48);border-radius:28px;background:rgba(45,7,15,.74);box-shadow:0 28px 80px rgba(0,0,0,.34);backdrop-filter:blur(10px)}
    .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(28px,8vw,42px);margin:12px 0 8px;color:var(--gold2)}
    .place{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.5;margin:0 0 8px}
    .sub{margin:0 0 28px;color:var(--muted);font-size:14px;line-height:1.6}
    .buttons{display:grid;gap:12px}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;min-height:56px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.02em;transition:.2s ease}
    .btn:active{transform:scale(.985)}
    .google{background:#fff;color:#2b2b2b;border:1px solid #fff}
    .waze{background:#59c9f1;color:#082b39;border:1px solid #8bddf7}
    .back{display:inline-block;margin-top:22px;color:var(--gold2);font-size:13px;text-decoration:none;border-bottom:1px solid rgba(242,227,189,.4);padding-bottom:2px}
    .orn{color:var(--gold);margin:18px 0 2px;opacity:.9}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Fazilla &amp; Aqib · 12.12.2026</div>
    <div class="orn">✦ ─── ♡ ─── ✦</div>
    <h1>Lokasi Majlis</h1>
    <p class="place">Dewan Serbaguna Kampung Kilimu<br>Ranau, Sabah</p>
    <p class="sub">Pilih aplikasi navigasi yang anda ingin gunakan.</p>
    <div class="buttons">
      <a class="btn google" href="https://www.google.com/maps/search/?api=1&query=Dewan%20Serbaguna%20Kampung%20Kilimu%2C%20Ranau%2C%20Sabah%2C%20Malaysia" target="_blank" rel="noopener">📍 Buka Google Maps</a>
      <a class="btn waze" href="https://www.waze.com/live-map/directions/dewan-serbaguna-kampung-kilimu-ranau?to=place.w.76480572.764674646.22955191" target="_blank" rel="noopener">🚗 Buka Waze</a>
    </div>
    <a class="back" href="./">← Kembali ke jemputan</a>
  </main>
</body>
</html>
