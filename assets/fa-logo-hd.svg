<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Fazilla &amp; Aqib Wedding Monogram</title>
  <desc id="desc">Luxury gold FA monogram with floral branches, names and wedding date.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset="0.18" stop-color="#e9c978"/>
      <stop offset="0.45" stop-color="#b98236"/>
      <stop offset="0.68" stop-color="#f4dda0"/>
      <stop offset="1" stop-color="#8e5f28"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e4ae"/>
      <stop offset="1" stop-color="#b78646"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#21050b" flood-opacity=".42"/>
    </filter>
  </defs>

