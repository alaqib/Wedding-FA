  <style>
    html,body{margin:0;min-height:100%;background:#3b0d16;color:#f6f0e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}

    #loader div{opacity:.82;letter-spacing:.08em;font-size:13px}

    /* 9:16 cinematic intro */
    #videoIntro{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 34%,#5c1728 0,#2c0811 66%,#170308 100%);display:grid;place-items:center;overflow:hidden;opacity:1;visibility:visible;transition:opacity .65s ease,visibility .65s ease}
    #videoIntro.hide{opacity:0;visibility:hidden;pointer-events:none}
    #videoIntro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#21070d}
    #videoIntro:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,2,6,.12),transparent 22%,transparent 76%,rgba(14,2,6,.28));box-shadow:inset 0 0 80px rgba(15,2,7,.20)}
    .intro-control{position:absolute;z-index:3;appearance:none;border:1px solid rgba(242,227,189,.55);background:rgba(31,5,12,.38);color:#fff8ed;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;font:600 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:.08em;padding:11px 14px;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.18)}
    #skipIntro{top:max(18px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right))}
    #introSound{left:max(16px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom))}
    #playIntro{display:none;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;font-size:12px;background:rgba(66,13,27,.78)}
    #playIntro.show{display:block}
    .intro-mark{position:absolute;z-index:2;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);font:600 9px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:.22em;color:rgba(255,244,218,.72);white-space:nowrap;text-shadow:0 2px 14px rgba(0,0,0,.35);pointer-events:none}
    @media (min-aspect-ratio:3/4){
      #videoIntro video{object-fit:contain}
      #videoIntro:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(125,35,57,.28),transparent 42%);pointer-events:none}
    }

    @media (prefers-reduced-motion:reduce){#videoIntro{display:none!important}}

<body class="intro-lock">
  <div id="loader"><div>FAZILLA &amp; AQIB<br><small>Memuatkan jemputan…</small></div></div>

  <div id="videoIntro" aria-label="Intro jemputan Fazilla dan Aqib">
    <video id="introVideo" autoplay muted playsinline preload="auto">
      <source src="./assets/gemini_generated_video_7B5DA9F3.mp4" type="video/mp4">
    </video>
    <button class="intro-control" id="skipIntro" type="button">LANGKAU</button>
    <button class="intro-control" id="introSound" type="button">🔇 BUNYI</button>
    <button class="intro-control" id="playIntro" type="button">▶ MAIN INTRO</button>
    <div class="intro-mark">FAZILLA &amp; AQIB · 12.12.2026</div>
  </div>

  <script>
    (async()=>{
      const intro=document.getElementById('videoIntro');
      const video=document.getElementById('introVideo');
      const skip=document.getElementById('skipIntro');
      const sound=document.getElementById('introSound');
      const playButton=document.getElementById('playIntro');
      let finished=false;

      const sitePromise=fetch('./wedding-site.html',{cache:'no-cache'}).then(response=>{
        if(!response.ok) throw new Error('HTTP '+response.status);
        return response.text();
      });

      const finishIntro=()=>{
        if(finished) return;
        finished=true;
        video.pause();
        intro.classList.add('hide');
        document.body.classList.remove('intro-lock');
        setTimeout(()=>intro.remove(),700);
      };

      skip.addEventListener('click',finishIntro,{once:true});
      video.addEventListener('ended',finishIntro,{once:true});
      video.addEventListener('error',finishIntro,{once:true});

      sound.addEventListener('click',()=>{
        video.muted=!video.muted;
        sound.textContent=video.muted?'🔇 BUNYI':'🔊 SENYAP';
        if(video.paused) video.play().catch(()=>{});
      });

      playButton.addEventListener('click',()=>{
        playButton.classList.remove('show');
        video.play().catch(()=>playButton.classList.add('show'));
      });

      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        finishIntro();
      }else{
        video.play().catch(()=>playButton.classList.add('show'));
      }

      // Safety fallback in case a mobile browser stalls the video.
      setTimeout(()=>{ if(!finished) finishIntro(); },14000);

      try{
        const html=await sitePromise;
        while(!finished){ await new Promise(resolve=>setTimeout(resolve,120)); }

        const confettiCSS=`
          /* Falling gold confetti — performance-tuned for mobile */
          .hero>.gold-confetti{position:absolute;inset:-12vh 0 0;overflow:hidden;pointer-events:none;z-index:4;contain:layout paint;}
          .gold-confetti-piece{position:absolute;left:var(--x);top:-10vh;width:var(--w);height:var(--h);border-radius:1px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 4px rgba(255,218,112,.18);opacity:0;will-change:transform,opacity;transform-origin:center;animation:faGoldFall var(--dur) linear var(--delay) infinite;}
          .gold-confetti-piece:nth-child(4n){border-radius:999px;}
          @keyframes faGoldFall{
            0%{transform:translate3d(0,-12vh,0) rotateZ(0deg);opacity:0;}
            7%{opacity:var(--a);}
            28%{transform:translate3d(var(--d1),32vh,0) rotateZ(135deg);opacity:var(--a);}
            54%{transform:translate3d(var(--d2),66vh,0) rotateZ(290deg);opacity:var(--a);}
            80%{transform:translate3d(var(--d3),98vh,0) rotateZ(455deg);opacity:calc(var(--a) * .92);}
            100%{transform:translate3d(var(--d4),128vh,0) rotateZ(var(--spin));opacity:0;}
          }
          .wishes-wall{color:#fff8f2;background:radial-gradient(circle at 50% 0,rgba(217,189,128,.12),transparent 32%),linear-gradient(150deg,#310710 0%,#501020 52%,#701a34 100%);overflow:hidden;}
          .wishes-wall:before{content:"";position:absolute;inset:18px;border:1px solid rgba(217,189,128,.10);border-radius:30px;pointer-events:none;}
          .wishes-frame-wrap{position:relative;z-index:1;width:min(900px,100%);margin:auto;border:1px solid rgba(217,189,128,.24);border-radius:30px;overflow:hidden;background:rgba(255,255,255,.025);box-shadow:0 18px 44px rgba(20,2,7,.18);}
          .wishes-frame{display:block;width:100%;height:420px;border:0;background:transparent;}
          .gift-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
          .hero .gift-trigger{background:linear-gradient(135deg,rgba(217,189,128,.16),rgba(255,255,255,.05));border-color:rgba(242,227,189,.72);}
          .gift-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;}
          .gift-modal.show{display:flex;}
          .gift-backdrop{position:absolute;inset:0;background:rgba(22,3,9,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);}
          .gift-card{position:relative;z-index:1;width:min(460px,94vw);max-height:88dvh;overflow:auto;padding:30px 24px 26px;text-align:center;border:1px solid rgba(217,189,128,.55);border-radius:30px;background:linear-gradient(165deg,#fffdf8 0%,#f8eee2 100%);box-shadow:0 28px 80px rgba(16,2,6,.42);color:#5a1723;}
          .gift-close{position:absolute;top:12px;right:12px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(90,23,35,.08);color:#5a1723;font:400 25px/1 sans-serif;cursor:pointer;}
          .gift-kicker{margin:2px 0 8px;font:700 10px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#ad8748;}
          .gift-title{margin:0 0 14px;font:400 clamp(30px,7vw,42px)/1.05 "Iowan Old Style","Baskerville","Times New Roman",Georgia,serif;color:#5a1723;}
          .gift-copy{max-width:360px;margin:0 auto 12px;color:#6f5f59;font:400 15px/1.75 "Iowan Old Style","Baskerville","Times New Roman",Georgia,serif;}
          .gift-copy.small{font-size:14px;color:#8a746d;}
          .gift-qr-wrap{width:min(310px,86vw);margin:20px auto 0;padding:10px;border:1px solid rgba(173,135,72,.28);border-radius:22px;background:#fff;box-shadow:0 12px 30px rgba(90,23,35,.10);}
          .gift-qr-wrap:before{content:"Nur Fazilla binti Maapus";display:block;margin:2px 0 10px;color:#5a1723;font:700 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:.02em;}
          .gift-qr{display:block;width:100%;height:auto;border-radius:14px;}
          body.gift-open{overflow:hidden!important;}
          @media(max-width:600px){
            .gold-confetti-piece{box-shadow:none;}
            .wishes-frame{height:390px;}
            .wishes-wall:before{inset:12px;border-radius:24px;}
            .gift-actions{gap:8px;}
            .gift-card{padding:28px 18px 22px;border-radius:24px;}
            .gift-copy{font-size:14px;line-height:1.65;}
            .gift-qr-wrap{width:min(290px,84vw);}
            .reveal{filter:none!important;transform:translateY(18px)!important;}
            .reveal.visible{transform:translateY(0)!important;}
            .floatbar{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(255,253,247,.96)!important;}
          }
          @media(prefers-reduced-motion:reduce){.hero>.gold-confetti{display:none!important;}}
        `;

        const tones=[
          ['#fff3bf','#d9a128'],
          ['#ffd55f','#b97813'],
          ['#f8c943','#e7a91c'],
          ['#fff0cf','#d6ad55'],
          ['#f4d06f','#c78d22']
        ];
        const isMobile=window.matchMedia('(max-width:600px)').matches;
        const lowPower=(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory&&navigator.deviceMemory<=4);
        const confettiCount=lowPower?18:(isMobile?24:42);
        let confetti='';
        for(let i=0;i<confettiCount;i++){
          const t=tones[Math.floor(Math.random()*tones.length)];
          const x=(Math.random()*100).toFixed(2);
          const w=(3.4+Math.random()*4.4).toFixed(1);
          const h=(7+Math.random()*9).toFixed(1);
          const dur=(8.2+Math.random()*6.5).toFixed(2);
          const delay=(-Math.random()*13).toFixed(2);
          const a=(.44+Math.random()*.38).toFixed(2);
          const sway=()=>((Math.random()-.5)*62).toFixed(0)+'px';
          const spin=(480+Math.random()*460).toFixed(0)+'deg';
          confetti+=`<i class="gold-confetti-piece" style="--x:${x}%;--w:${w}px;--h:${h}px;--dur:${dur}s;--delay:${delay}s;--a:${a};--d1:${sway()};--d2:${sway()};--d3:${sway()};--d4:${sway()};--spin:${spin};--c1:${t[0]};--c2:${t[1]}"></i>`;
        }

        let enhanced=html.replace('</style>',confettiCSS+'</style>');
        enhanced=enhanced.replaceAll('assets/7E485076-9F38-4524-95B2-FF7D4D3B3092.png?v=restore2','assets/7E485076-9F38-4524-95B2-FF7D4D3B3092.png?v=fa-logo');
        enhanced=enhanced.replaceAll('assets/7E485076-9F38-4524-95B2-FF7D4D3B3092.png?v=direct4','assets/7E485076-9F38-4524-95B2-FF7D4D3B3092.png?v=fa-logo');
        enhanced=enhanced.replace('decoding="sync"','decoding="async"');
        enhanced=enhanced.replace('<section class="hero" id="home">','<section class="hero" id="home"><div class="gold-confetti" aria-hidden="true">'+confetti+'</div>');
        enhanced=enhanced.replace('<a class="btn" href="#majlis">Lihat Jemputan ↓</a>','<div class="gift-actions"><a class="btn" href="#majlis">Lihat Jemputan ↓</a><button class="btn gift-trigger" id="giftBtn" type="button">🎁 Hadiah</button></div>');
        enhanced=enhanced.replace('<div class="family"><h3>Keluarga Pengantin Lelaki</h3><p>Dg Arpiah bte Pg Ahmad<br><span class="amp">&amp;</span><br>Kiffli bin Abd Sani</p></div>','<div class="family"><h3>Keluarga Pengantin Lelaki</h3><p>Dg Arpiah bte Pg Ahmad<br>Mohamed Mohammad Bin Ali<br><span class="amp">&amp;</span><br>Kiffli bin Abd Sani</p></div>');
        enhanced=enhanced.replace('<div class="family"><h3>Keluarga Pengantin Perempuan</h3><p>Mineh Maidi<br><span class="amp">&amp;</span><br>Mohamad Maapus bin Waidi</p></div>','<div class="family"><h3>Keluarga Pengantin Perempuan</h3><p>Mohamad Maapus bin Waidi<br><span class="amp">&amp;</span><br>Mineh Maidi</p></div>');
        const wishesSection='<section class="content wishes-wall" id="ucapan"><div class="wrap reveal"><div class="wishes-frame-wrap"><iframe class="wishes-frame" title="Ucapan dan doa untuk Fazilla dan Aqib" loading="lazy" src="https://fa-wedding-rsvp-2xm9j8.v2.appdeploy.ai/?wishes=1&amp;embed=1"></iframe></div></div></section>';
        enhanced=enhanced.replace('<section class="closing">',wishesSection+'<section class="closing">');
        const giftModal='<div class="gift-modal" id="giftModal" aria-hidden="true"><div class="gift-backdrop" id="giftBackdrop"></div><div class="gift-card" role="dialog" aria-modal="true" aria-labelledby="giftTitle"><button class="gift-close" id="giftClose" type="button" aria-label="Tutup">×</button><div class="gift-kicker">Tanda Kasih</div><h3 class="gift-title" id="giftTitle">Hadiah</h3><p class="gift-copy">Kehadiran, doa dan restu anda sudah cukup bermakna buat kami. Namun, jika anda berhasrat untuk memberi hadiah, bolehlah menggunakan QR DuitNow di bawah.</p><p class="gift-copy small">Terima kasih atas segala ingatan, doa dan kasih sayang anda buat kami.</p><div class="gift-qr-wrap"><img class="gift-qr" src="assets/26475bda-f0f3-4327-9209-26a66e855c77.jpeg" alt="QR DuitNow hadiah untuk Fazilla dan Aqib"></div></div></div>';
        const giftScript='<script>(()=>{const b=document.getElementById("giftBtn"),m=document.getElementById("giftModal"),x=document.getElementById("giftClose"),d=document.getElementById("giftBackdrop");if(!b||!m)return;const open=()=>{m.classList.add("show");m.setAttribute("aria-hidden","false");document.body.classList.add("gift-open")};const close=()=>{m.classList.remove("show");m.setAttribute("aria-hidden","true");document.body.classList.remove("gift-open")};b.addEventListener("click",open);if(x)x.addEventListener("click",close);if(d)d.addEventListener("click",close);document.addEventListener("keydown",e=>{if(e.key==="Escape")close()})})();<\/script>';
        enhanced=enhanced.replace('</body>',giftModal+giftScript+'</body>');

        document.open();
        document.write(enhanced);
        document.close();
      }catch(error){
        finishIntro();
        const loader=document.getElementById('loader');
        if(loader) loader.innerHTML='<div>Jemputan tidak dapat dimuatkan.<br><small>Sila refresh halaman ini.</small></div>';
        console.error(error);
      }
    })();
  </script>
